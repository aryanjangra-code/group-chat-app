<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GroupChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
    

  <div id="join-screen">
    <button class="theme-toggle theme-toggle1" class="theme-btn">☀️</button>
    <div class="join-card">
      <div class="join-logo">GroupChat </div>
      <p class="join-sub">One room. Everyone's here.</p>
      <input type="text" id="username-input" placeholder="Type your username…" maxlength="20" autocomplete="off" />
      <input type="password" id="password-input" placeholder="Type your password…" maxlength="20" autocomplete="off" />
      <button class="btn-join" id="join-btn">Login →</button>
      <button class="btn-secondary" id="register-btn">Register New Account</button>
    </div>
    <div class="register-card">
      <button class="backtologin" id="backtologinbtn">←</button>
      <h2 class="join-logo">Create Account</h2>
      <input type="text" id="register-username" placeholder="Type your username…" maxlength="20" autocomplete="off" />
      <input type="email" id="register-email" placeholder="Type your Email..." autocomplete="email" />
      <input type="password" id="register-password" placeholder="Type your password…" maxlength="20"
        autocomplete="off" />
      <p id="login-error"></p>
      <button class="btn-join" id="register-submit">Register</button>
    </div>
  </div>


  <div id="chat-screen">
    <button class="theme-toggle theme-toggle2" class="theme-btn">☀️</button>
    <aside class="sidebar">
      <div class="sidebar-logo">GroupChat</div>
      <div class="sidebar-section-label">Online Now</div>
      <ul id="user-list"></ul>
      <div class="online-badge">
        🟢 <strong id="online-count">0</strong>&nbsp;online
      </div>
    </aside>


    <main class="chat-main">
      <header class="chat-header">
        <div class="room-icon">💬</div>
        <div>
          <h1># general</h1>
          <div class="header-sub">Public group chat</div>
        </div>
        <div class="header-right">
          <div id="my-name-badge">you: —</div>
        </div>
      </header>

      <div id="messages"></div>
      <div id="typing-indicator"></div>

      <div class="input-bar">
        <textarea id="msg-input" placeholder="Type a message…" rows="1"></textarea>
        <button id="send-btn" title="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13" />
            <polygon points="22 2 15 22 11 13 2 9 22 2" />
          </svg>
        </button>
      </div>
    </main>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>

</html>
